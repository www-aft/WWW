<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>图片</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:#fff;
  font-family:Arial
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
  padding:10px
}

.item{
  background:#1e293b;
  padding:8px;
  border-radius:10px
}

img{
  width:100%;
  border-radius:8px
}

.actions{
  display:flex;
  gap:5px;
  margin-top:5px
}

button,a{
  flex:1;
  padding:6px;
  border:none;
  border-radius:6px;
  color:white;
  text-align:center;
  text-decoration:none;
  font-size:12px;
  cursor:pointer
}

.view{background:#22c55e}
.download{background:#3b82f6}

.footer{
  text-align:center;
  font-size:12px;
  color:#94a3b8;
  margin:10px
}
</style>
</head>

<body>

<h3 style="text-align:center;">🖼 图片 (túpiàn)</h3>

<div class="gallery" id="gallery"></div>

<div class="footer">
20/3/2026 • @ 2026 ©
</div>

<script>
// ✅ Tự tạo danh sách ảnh (không cần viết tay)
const images = Array.from({length:26}, (_,i)=>`images/${i+1}.jpg`);

const gallery = document.getElementById("gallery");

images.forEach(src=>{
  const div = document.createElement("div");
  div.className = "item";

  // ✅ Có alt + xử lý lỗi ảnh
  div.innerHTML = `
    <img src="${src}" alt="image"
    onerror="this.src='https://via.placeholder.com/150?text=Error'">
  `;

  const actions = document.createElement("div");
  actions.className = "actions";

  // 🔥 Xem ảnh
  const view = document.createElement("button");
  view.className = "view";
  view.innerText = "查看";
  view.onclick = ()=> window.open(src, "_blank");

  // 🔥 Tải ảnh (fix cho GitHub)
  const download = document.createElement("a");
  download.className = "download";
  download.innerText = "下载";
  download.href = src;
  download.setAttribute("download", `image_${Date.now()}.jpg`);

  actions.appendChild(view);
  actions.appendChild(download);

  div.appendChild(actions);
  gallery.appendChild(div);
});
</script>

</body>
</html>
